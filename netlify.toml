# Disclosure Desk controlled public deployment
# Never publish the Git repository root: it contains non-website scripts and internal docs.
[build]
  command = "node scripts/build_public_release.cjs"
  publish = ".release-staging/public-site"
  ignore = '''[ "$BRANCH" = "android/m104-branded-sharing" ] || [ "$HEAD" = "android/m104-branded-sharing" ] || [ "$BRANCH" = "feature/brand-public-sharing-20261127" ] || [ "$HEAD" = "feature/brand-public-sharing-20261127" ] || [ "$BRANCH" = "fix/issue22-mobile-nav-polish-20261127" ] || [ "$HEAD" = "fix/issue22-mobile-nav-polish-20261127" ] || [ "$BRANCH" = "feature/issue-22-final-launch-polish" ] || [ "$HEAD" = "feature/issue-22-final-launch-polish" ] || [ "$BRANCH" = "feature/research-collaboration-20261126" ] || [ "$BRANCH" = "fix/guest-public-access-20261126" ] || [ "$BRANCH" = "feature/experience-discovery-20261127" ] || [ "$BRANCH" = "feature/become-investigator-20261127" ] || [ "$BRANCH" = "feature/news-pagination-20261127" ] || [ "$BRANCH" = "fix/news-pager-full-width-20261127" ]'''


# Legacy browser/crawler fallback: preserve the verified navy-and-gold SVG emblem.
# No favicon.ico binary is currently shipped in the strict public allowlist.
# Exact path only; do not redirect other missing resources or hidden files.
[[redirects]]
  from = "/favicon.ico"
  to = "/assets/disclosure-desk-mark.svg"
  status = 302

# Branded public share links. Fixed same-origin destinations only; never an open redirect.
