# Disclosure Desk controlled public deployment
# Never publish the Git repository root: it contains non-website scripts and internal docs.
[build]
  command = "node scripts/build_public_release.cjs"
  publish = ".release-staging/public-site"
  ignore = '''[ "$BRANCH" = "android/m115-navigation-stability" ] || [ "$HEAD" = "android/m115-navigation-stability" ] || [ "$BRANCH" = "android/m114-comparison-label" ] || [ "$HEAD" = "android/m114-comparison-label" ] || [ "$BRANCH" = "android/m113-wne-menu-clearance" ] || [ "$HEAD" = "android/m113-wne-menu-clearance" ] || [ "$BRANCH" = "android/m112-launch-frame" ] || [ "$HEAD" = "android/m112-launch-frame" ] || [ "$BRANCH" = "android/m111-wne-layout" ] || [ "$HEAD" = "android/m111-wne-layout" ] || [ "$BRANCH" = "android/m110-shared-navigation" ] || [ "$HEAD" = "android/m110-shared-navigation" ] || [ "$BRANCH" = "android/m109-persistent-directory" ] || [ "$HEAD" = "android/m109-persistent-directory" ] || [ "$BRANCH" = "android/m108-wne-polish" ] || [ "$HEAD" = "android/m108-wne-polish" ] || [ "$BRANCH" = "android/m107-desk-help" ] || [ "$HEAD" = "android/m107-desk-help" ] || [ "$BRANCH" = "android/m106-play-ready" ] || [ "$HEAD" = "android/m106-play-ready" ] || [ "$BRANCH" = "feature/seo-keyword-launch-20261128" ] || [ "$HEAD" = "feature/seo-keyword-launch-20261128" ] || [ "$BRANCH" = "feature/share-identifiable-previews-20261127" ] || [ "$HEAD" = "feature/share-identifiable-previews-20261127" ] || [ "$BRANCH" = "feature/brand-public-sharing-20261127" ] || [ "$HEAD" = "feature/brand-public-sharing-20261127" ] || [ "$BRANCH" = "fix/issue22-mobile-nav-polish-20261127" ] || [ "$HEAD" = "fix/issue22-mobile-nav-polish-20261127" ] || [ "$BRANCH" = "feature/issue-22-final-launch-polish" ] || [ "$HEAD" = "feature/issue-22-final-launch-polish" ] || [ "$BRANCH" = "feature/research-collaboration-20261126" ] || [ "$BRANCH" = "fix/guest-public-access-20261126" ] || [ "$BRANCH" = "feature/experience-discovery-20261127" ] || [ "$BRANCH" = "feature/become-investigator-20261127" ] || [ "$BRANCH" = "feature/news-pagination-20261127" ] || [ "$BRANCH" = "fix/news-pager-full-width-20261127" ]'''


# Legacy browser/crawler fallback: preserve the verified navy-and-gold SVG emblem.
# No favicon.ico binary is currently shipped in the strict public allowlist.
# Exact path only; do not redirect other missing resources or hidden files.
[[redirects]]
  from = "/favicon.ico"
  to = "/assets/disclosure-desk-mark.svg"
  status = 302

# The approved share preview function now owns these record paths. Human
# recipients continue to the same in-app record using a fixed same-origin URL.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
