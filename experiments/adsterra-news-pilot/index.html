<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>News · Disclosure Desk</title>
<style>
:root{color-scheme:dark;font:16px/1.55 system-ui,sans-serif;background:#0b141e;color:#eaf0f4}
body{margin:0}
header{border-bottom:1px solid #324555;background:#132331}
header div,main{width:min(100% - 20px,700px);margin:auto}
header div{padding:16px 0}
header strong{letter-spacing:.08em;color:#dec28f}
main{padding:28px 0 44px}
h1{font-size:clamp(2rem,7vw,3rem);letter-spacing:-.035em;margin:0 0 .7em}
h2{font-size:1rem;margin:0}
article,.preferences{border:1px solid #324555;border-radius:12px;background:#132331;padding:16px;margin:0 0 12px}
article a,a{color:#f0d7a7}
.meta,.preferences p{color:#c6d4dd;margin:.4rem 0 0}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.choices button{flex:1;min-height:44px;padding:8px 12px;font:inherit;border-radius:8px;border:1px solid #bda47a;background:#182b3b;color:#f0d7a7;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
a:focus-visible,button:focus-visible{outline:2px solid #e9cc93;outline-offset:3px}
.banner{display:none;margin:18px auto;width:300px}
.banner:has(iframe){display:block}
.ad-label{display:block;font-size:.75rem;color:#c6d4dd;margin-bottom:4px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div><strong>DISCLOSURE DESK</strong> · <a href="https://uapdisclosuredesk.com/">Main site</a></div></header>
<main>
<h1>UAP news</h1>
<div id="advertising-choices">__CHOICES__</div>
<section aria-label="Selected reporting">__STORIES__</section>
<aside id="advertisement" class="banner" aria-label="Advertisement"></aside>
</main>
__BOOTSTRAP__
</body>
</html>
