name: Community Research prototype QA (no deploy)
on:
  push:
    branches: [feature/community-research-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned disposable database and browser tools
        run: npm install --no-save --no-package-lock --ignore-scripts @electric-sql/pglite@0.5.16 playwright-core@1.56.1
      - name: Check publication projection and permissions
        run: |
          node --check research/community-publication-preview.js
          node scripts/test_community_research_draft.cjs
          node scripts/test_community_research_preview.cjs
          node scripts/test_community_research_transfer.cjs
      - name: Current production baseline news regression (localhost source only)
        run: |
          node scripts/test_published_html_syntax.cjs
          node scripts/test_news_pagination.cjs
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dd-cr-source-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/index.html -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/test_news_pagination_chromium.cjs
