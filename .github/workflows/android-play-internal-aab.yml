name: Disclosure Desk Play Internal AAB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  play-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check secure upload signing configuration
        env:
          KEYSTORE: ${{ secrets.DD_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.DD_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DD_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.DD_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Play upload signing secrets are not configured. Do not use debug signing for a Play track."
            exit 1
          fi
      - name: Install Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare private upload keystore
        env:
          KEYSTORE: ${{ secrets.DD_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/dd-upload.jks"
          test -s "$RUNNER_TEMP/dd-upload.jks"
      - name: Build signed release bundle
        working-directory: android-test
        env:
          DD_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/dd-upload.jks
          DD_UPLOAD_STORE_PASSWORD: ${{ secrets.DD_UPLOAD_STORE_PASSWORD }}
          DD_UPLOAD_KEY_ALIAS: ${{ secrets.DD_UPLOAD_KEY_ALIAS }}
          DD_UPLOAD_KEY_PASSWORD: ${{ secrets.DD_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease
      - name: Upload AAB for manual Play Console internal testing
        uses: actions/upload-artifact@v4
        with:
          name: DisclosureDesk-Play-Internal-AAB
          path: android-test/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
      - name: Remove private keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/dd-upload.jks"
