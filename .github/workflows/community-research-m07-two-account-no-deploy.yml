name: "Community Research M07 two-account pilot security NO DEPLOY"
on:
  push:
    branches:
      - prep/community-research-m07-two-account-pilot-20261118
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-existing-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check existing M05 non-deploy contract and strict package
        run: |
          node --check assets/community-research-private-drafts.js
          node --check assets/community-research-publication.js
          node --check assets/community-research-recovery.js
          node --check assets/community-research-dashboard.js
          node --check assets/community-research-author-workflow.js
          node scripts/test_community_research_m07_contract.cjs
          node scripts/test_community_research_m02_adapter.cjs
          node scripts/test_community_research_m03_publication_adapter.cjs
          node scripts/build_public_release.cjs
          node scripts/test_public_release_package.cjs
          test ! -f .release-staging/public-site/docs/COMMUNITY_RESEARCH_M07_TWO_ACCOUNT_PILOT.sql
          test ! -f .release-staging/public-site/docs/COMMUNITY_RESEARCH_M07B_STATUS_RPC.sql
          test ! -f .release-staging/public-site/scripts/fixtures/community-research-m07-pilot-rls-test.sql
          echo "No site deployment or additional project"
  isolated-pilot-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dd_cr_m07_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dd_cr_m07_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: dd_cr_m07_qa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up PostgreSQL SQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Apply exact M06 sealed schema then M07 empty pilot migration
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/community-research-m02-postgres-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f docs/COMMUNITY_RESEARCH_M06_LOCKED_EXISTING_PROJECT.sql
          psql -v ON_ERROR_STOP=1 -f docs/COMMUNITY_RESEARCH_M07_TWO_ACCOUNT_PILOT.sql
          psql -v ON_ERROR_STOP=1 -f docs/COMMUNITY_RESEARCH_M07B_STATUS_RPC.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/community-research-m07-pilot-rls-test.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/community-research-m07b-status-test.sql
          echo "PASS: enrolled synthetic A/B only, C and guests blocked, test revoked, no live data"
  chrome-production-pilot-mock:
    needs: review-existing-package
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up pinned Chromium driver
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          test -x /usr/bin/google-chrome
      - name: Validate limited production-host beta and inherited W.NE author UI
        run: |
          node --check scripts/test_community_research_m07_browser.cjs
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dd-m07-browser.log 2>&1 &
          echo $! >/tmp/dd-m07-browser.pid
          for i in $(seq 1 20); do
            curl -fsS --max-time 2 http://127.0.0.1:4173/my-research.html >/dev/null && break
            sleep 1
          done
          node scripts/test_community_research_m03_browser.cjs
          node scripts/test_community_research_m04_browser.cjs
          node scripts/test_community_research_m05_browser.cjs
          node scripts/test_community_research_m07_browser.cjs
      - name: Stop isolated test-only server
        if: always()
        run: |
          if test -f /tmp/dd-m07-browser.pid; then
            kill "$(cat /tmp/dd-m07-browser.pid)" 2>/dev/null || true
          fi
