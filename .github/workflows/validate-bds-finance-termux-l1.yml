name: BDS Finance L1 encrypted Termux vault (synthetic-only, no deploy)
on:
  push:
    branches:
      - feature/sources-archives-next-batch-nov03
    paths:
      - 'finance_local/**'
      - '.github/workflows/validate-bds-finance-termux-l1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-vault:
    name: Offline encryption and recovery regression (disposable Linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install audited cryptography dependency for CI only
        run: python -m pip install 'cryptography==46.0.4'
      - name: Compile offline vault
        run: python -m py_compile finance_local/vault.py finance_local/tests/test_vault.py
      - name: Test AES-GCM, Scrypt, passphrase denial, simulated failure, encrypted backup and restore
        run: python -m unittest discover -s finance_local/tests -v
      - name: Verify source has no provider-sync endpoint or server listener
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('finance_local/vault.py').read_text()
          assert 'DEMO_MODE = "synthetic-demo"' in src
          assert 'AESGCM' in src and 'Scrypt' in src
          assert 'getpass.getpass' in src
          assert 'socket.' not in src and 'http.server' not in src
          assert 'requests.' not in src and 'urllib.request' not in src
          assert 'os.environ.get("PAYPAL' not in src
          print('PASS: local-only L1 demonstration; no payment account or network interfaces')
          PY
      - name: Verify exact ZIP/source parity and missing os.link safety
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import zipfile
          from pathlib import Path
          files=['finance_local/vault.py','finance_local/tests/test_vault.py','finance_local/README.md','finance_local/__init__.py','finance_local/.gitignore']
          expected='b4b51143ad53487d82f2c6a0588ddac45fc22220df9fa76ac5b7a9bd07331422'
          for archive in ['finance_local/BDS_Finance_Termux_L1_demo.zip','finance_local/BDS_Finance_Termux_L1_Android_fix.zip']:
              blob=Path(archive).read_bytes()
              assert hashlib.sha256(blob).hexdigest()==expected,archive
              with zipfile.ZipFile(archive) as z:
                  assert sorted(z.namelist())==sorted(files)
                  for p in files:
                      assert z.read(p)==Path(p).read_bytes(),(archive,p)
          tree=ast.parse(Path('finance_local/vault.py').read_text())
          for n in ast.walk(tree):
              if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute) and n.func.attr=='link' and isinstance(n.func.value,ast.Name) and n.func.value.id=='os':
                  raise AssertionError('os.link incompatible with Samsung Termux')
          print('PASS: Android patch ZIP and GitHub sources identical; no os.link calls')
          PY
      - name: Run L2 private dashboard HTTP security unit tests (no provider or network access)
        run: |
          python -m py_compile finance_local/dashboard.py finance_local/tests/test_dashboard.py
          python -m unittest discover -s finance_local/tests -p 'test_dashboard.py' -v
      - name: Verify BDS Finance L2 private dashboard ZIP and local security assumptions
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, ast
          archive=Path('finance_local/BDS_Finance_L2_Private_Dashboard.zip')
          expected='ae425e6f40ece9f5a44afe5bf42803dc67b15d6a73ef44369ef5241e8eb9e2dc'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==expected
          files=['finance_local/dashboard.py','finance_local/DASHBOARD_README.md']
          with ZipFile(archive) as z:
            assert sorted(z.namelist())==sorted(files)
            for f in files: assert z.read(f)==Path(f).read_bytes(),f
          code=Path('finance_local/dashboard.py').read_text()
          ast.parse(code)
          assert "HOST = '127.0.0.1'" in code
          assert 'MAX_SESSION_SECONDS = 600' in code
          assert 'hmac.compare_digest' in code and 'Cache-Control' in code
          assert 'vault.load(' in code and 'vault.seal(' not in code
          assert 'localStorage' not in code and 'sessionStorage' not in code
          print('PASS L2: no-vault-overwrite ZIP, local read-only access and short session')
          PY
