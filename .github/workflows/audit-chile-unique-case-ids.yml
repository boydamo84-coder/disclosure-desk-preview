name: Chile SEFAA unique case-number audit (DEV, no deploy)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/mobile-video-performance-oct31
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count unique case-number PDFs from official monthly SEFAA pages
        run: |
          python - <<'PY'
          import collections,re,urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlsplit,unquote
          class Links(HTMLParser):
            def __init__(self):super().__init__();self.href=None;self.parts=[];self.links=[]
            def handle_starttag(self,tag,attrs):
              if tag=='a':self.href=dict(attrs).get('href');self.parts=[]
            def handle_data(self,data):
              if self.href is not None:self.parts.append(data)
            def handle_endtag(self,tag):
              if tag=='a' and self.href is not None:
                self.links.append((' '.join(self.parts).strip(),self.href));self.href=None
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'DisclosureDeskArchiveAudit/1.0'})
            with urllib.request.urlopen(req,timeout=20) as r:raw=r.read(1_500_001)
            if len(raw)>1_500_000:raise ValueError('Page too large')
            p=Links();p.feed(raw.decode('utf-8','replace'));return p.links
          months={}
          failed=[]
          for year in range(2018,2027):
            try:
              for label,href in get(f'https://sefaa.dgac.gob.cl/{year}/'):
                if not re.search(r'casos?\s+(?:resueltos?\s+)?(?:enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)',label,re.I):continue
                url=urljoin(f'https://sefaa.dgac.gob.cl/{year}/',href)
                if urlsplit(url).hostname=='sefaa.dgac.gob.cl':months[url]=year
            except Exception as e:failed.append((str(year),type(e).__name__))
          case_numbers=collections.defaultdict(set)
          unknown=[];pages_failed=[]
          for page in months:
            try:
              for label,href in get(page):
                url=urljoin(page,href)
                parsed=urlsplit(url)
                if parsed.hostname!='sefaa.dgac.gob.cl' or not unquote(parsed.path).lower().endswith('.pdf'):continue
                filename=unquote(parsed.path).split('/')[-1]
                match=re.search(r'caso[\s_-]*(?:n[°ºo.]*)?[\s_-]*(\d{2,5})(?!\d)',filename,re.I)
                if match:case_numbers[match.group(1)].add(url)
                else:unknown.append((page,filename[:100]))
            except Exception as e:pages_failed.append((page,type(e).__name__))
          repeated={k:len(v) for k,v in case_numbers.items() if len(v)>1}
          print('Monthly pages discovered:',len(months))
          print('Unique official case numbers extracted:',len(case_numbers))
          print('Multiple PDF URLs sharing the same case number:',len(repeated))
          print('Example repeated case numbers:',list(sorted(repeated.items()))[:20])
          print('PDF links without an identifiable case number:',len(unknown))
          print('Annual index failures:',failed)
          print('Monthly page failures:',len(pages_failed))
          print('Example unique case numbers:',list(sorted(case_numbers))[:20])
          print('Read-only discovery only. No PDF contents copied, no case imports, no Netlify deploy.')
          PY
