name: Ads M03 GA4 retirement, Netlify analytics only — NO DEPLOY
on:
  push:
    branches: [prep/site-ads-m03-remove-ga4-20261118]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-immutable-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all GA4 removal and isolated-ad contracts
        run: |
          node --check scripts/test_ga4_retirement_20261118.cjs
          node --check scripts/test_m40_ui_analytics_contract_20261109.cjs
          node --check assets/site-adsterra-m02.js
          node scripts/test_ga4_retirement_20261118.cjs
          node scripts/test_m40_ui_analytics_contract_20261109.cjs
          node scripts/test_site_ads_m01_contract.cjs
          node scripts/test_site_ads_m02_contract.cjs
      - name: Validate exact public-only release archive offline
        env:
          CONTEXT: production
        run: |
          node scripts/build_public_release.cjs
          node scripts/test_public_release_package.cjs
          test ! -e .release-staging/public-site/assets/analytics-consent.js
          test -e .release-staging/public-site/assets/site-adsterra-m02.js
          ! grep -q 'analytics-consent.js' .release-staging/public-site/index.html
          ! grep -q 'const RELEASE_ENABLED=true' .release-staging/public-site/assets/site-adsterra-m02.js
          test ! -e .release-staging/public-site/scripts/test_ga4_retirement_20261118.cjs
  actual-chromium:
    runs-on: ubuntu-latest
    needs: contracts-and-immutable-package
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated Chrome test harness
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          test -x /usr/bin/google-chrome
      - name: Local-only browser tests on mobile and desktop
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dd-ga4-m03.log 2>&1 &
          echo $! >/tmp/dd-ga4-m03.pid
          for i in $(seq 1 15); do
            curl -fsS --max-time 2 http://127.0.0.1:4173/privacy.html >/dev/null && break
            sleep 1
          done
          node scripts/test_ga4_retirement_chromium_20261118.cjs
          node scripts/test_site_ads_m01_chromium.cjs
          node scripts/test_m40_research_map_ga_chromium_20261109.cjs
      - name: Stop local server
        if: always()
        run: |
          if test -f /tmp/dd-ga4-m03.pid; then
            kill "$(cat /tmp/dd-ga4-m03.pid)" 2>/dev/null || true
          fi
