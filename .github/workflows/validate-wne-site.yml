name: Validate W.NE Research Studio website integration (no deploy)
on:
  push:
    branches:
      - feature/research-studio-bds-production-based
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wne-site-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production tabs, contact, privacy and canonical W.NE integration
        run: |
          node --check scripts/test_wne_site_integration.cjs
          node --check scripts/smoke_wne_website.mjs
          node --check scripts/test_search_indexing.cjs
          node scripts/test_wne_site_integration.cjs
          node scripts/test_search_indexing.cjs
      - name: Staged LIVE and witness community source checks (no deploy)
        run: |
          node --check scripts/test_live_schedule.cjs
          node scripts/test_live_schedule.cjs
          node --check scripts/test_witness_community.cjs
          node scripts/test_witness_community.cjs
          node --check scripts/test_witness_moderation.cjs
          node scripts/test_witness_moderation.cjs
          node --check scripts/test_witness_geocoding.cjs
          node scripts/test_witness_geocoding.cjs
          node --check scripts/test_public_profiles.cjs
          node scripts/test_public_profiles.cjs
          node --check scripts/test_research_hub.cjs
          node scripts/test_research_hub.cjs
          node --check assets/research-hub.js
          node --check scripts/test_comment_security.cjs
          node scripts/test_comment_security.cjs
          node --check scripts/test_comment_public_privacy.cjs
          node scripts/test_comment_public_privacy.cjs
          node --check scripts/test_comment_self_moderation.cjs
          node scripts/test_comment_self_moderation.cjs
      - name: Live community HTTP guest and unauthorised-access checks (no deployment)
        run: |
          node --check scripts/test_community_http.mjs
          node scripts/test_community_http.mjs
      - name: Install local-browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Smoke-test new W.NE website integration on mobile and desktop
        run: node scripts/smoke_wne_website.mjs
      # Production uses a different video-control layout from main.
      # The earlier main-only smoke_preview.mjs cannot select its hidden filter.
      # The updated mobile/desktop smoke above verifies every production tab,
      # including Videos, without changing the live UI to satisfy a stale test.
