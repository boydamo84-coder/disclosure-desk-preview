name: Update world media news alerts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-alerts.yml'
      - 'scripts/update_news_alerts.py'
  schedule:
    - cron: '43 */2 * * *'
concurrency:
  group: disclosure-news-catalogue-writer
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google News URL resolver
        run: python -m pip install 'gnews-decoder==0.1.1'
      - name: Collect sourced news headlines
        run: python scripts/update_news_alerts.py
      - name: Commit refreshed news
        run: |
          git config user.name "Disclosure Desk Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news-alerts.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh major-media UAP headlines"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
      - name: Publish updated catalogue to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Changes pushed with GITHUB_TOKEN do not automatically run push workflows.
          # A workflow_dispatch event is permitted and publishes the collected JSON.
          gh workflow run pages.yml --ref main
