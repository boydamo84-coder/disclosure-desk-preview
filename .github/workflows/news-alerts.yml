name: Update world media news alerts
on:
  workflow_dispatch:
  schedule:
    - cron: '43 */2 * * *'
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect sourced news headlines
        run: python scripts/update_news_alerts.py
      - name: Commit refreshed news
        run: |
          git config user.name "Disclosure Desk Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news-alerts.json
          git diff --cached --quiet || (git commit -m "Refresh major-media UAP headlines" && git push)
