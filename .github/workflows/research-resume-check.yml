name: Verify Research Studio resume and existing community (NO deploy)
on:
  push:
    branches: [fix/research-mobile-profile-polish-nov08, staging/research-samsung-m16-20261108, fix/compact-writing-popover-mobile-desktop-nov08]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks for modified modules
        run: |
          node --check research/wne-cloud-bridge.js
          node --check assets/profile-avatars.js
          node --check scripts/test_research_resume_20261108.cjs
      - name: M34 community and W.NE design contracts (NO deploy)
        run: |
          node --check scripts/test_m34_ui_contract_20261109.cjs
          node scripts/test_m34_ui_contract_20261109.cjs
          node --check scripts/test_m34_community_consistency_20261109.cjs
          node scripts/test_m34_community_consistency_20261109.cjs
          node --check assets/news-article-votes.js
      - name: Research Studio resume and Home QA (mock account)
        run: node scripts/test_research_resume_20261108.cjs
      - name: Research ZIP, recovery and import route regression
        run: |
          node --check research/wne-cloud-bridge.js
          node scripts/test_research_backup_recovery_20261108.cjs
          node --check research/research-docx-import.js
          node --check scripts/test_research_docx_inline_import_20261108.cjs
          node scripts/test_research_docx_inline_import_20261108.cjs
          node --check scripts/test_research_original_request_audit_20261108.cjs
          node scripts/test_research_original_request_audit_20261108.cjs
          node --check scripts/test_external_sources_audit_20261108.cjs
          node scripts/test_external_sources_audit_20261108.cjs
          node --check research/restore-library-core.js
          node --check research/restore-library.js
          node scripts/test_research_library_zip_restore_20261108.cjs
      - name: Research editor Insert menu and selection retention
        run: |
          node --check research/research-insert-menu.js
          node scripts/test_research_insert_menu_20261108.cjs
      - name: Research selected-text size, save sanitization and export
        run: |
          node --check research/research-text-size.js
          node --check research/docx-tools.js
          node --check research/wne-export-integration.js
          node scripts/test_research_selected_size_20261108.cjs
      - name: Research writing review navigation syntax
        run: |
          node --check research/wne-research-live-spelling.js
          node --check scripts/test_research_review_chromium_20261108.cjs
          node --check scripts/test_research_library_chromium_20261108.cjs
          node --check research/research-site-nav.js
          node --check scripts/test_research_nav_avatar_chromium_20261108.cjs
          node --check assets/analytics-consent.js
          node --check scripts/test_analytics_consent_chromium_20261108.cjs
          node --check scripts/audit_public_pages_chromium_20261108.cjs
          node --check scripts/audit_full_site_chromium_20261108.cjs
          node --check scripts/test_m28_public_workflows_chromium_20261108.cjs
          node --check scripts/test_research_home_navigation_chromium_20261108.cjs
          node --check scripts/test_research_json_restore_chromium_20261108.cjs
          node --check scripts/test_m30_first_document_chromium_20261109.cjs
          node --check research/restore-library-core.js
          node --check research/restore-copy.js
      - name: Preserve existing avatar and community behavior
        run: |
          node scripts/test_avatar_auto_upload_20261108.cjs
          node scripts/test_safari_profile_avatars_20261108.cjs
          node scripts/test_chat_stability_and_invite.cjs
          node scripts/test_member_avatar_display.cjs
      - name: Signed-in account switch, Chat, Discussions and privacy contracts (mock only)
        run: |
          node --check assets/discussions-admin.js
          node --check scripts/test_discussions_admin_account_switch_20261108.cjs
          node scripts/test_discussions_admin_account_switch_20261108.cjs
          node scripts/test_discussions_account_switch_runtime.cjs
          node scripts/test_private_chat_account_switch_runtime.cjs
          node scripts/test_private_chat_switch_mutations.cjs
          node scripts/test_member_avatar_race.cjs
          node scripts/test_public_profiles.cjs
          node scripts/test_comment_security.cjs
          node --check scripts/test_comment_action_rail_chromium_20261108.cjs
          node --check assets/community-votes.js
          node --check assets/case-discussions.js
          node --check assets/inline-news-comments.js
          node scripts/test_comment_self_moderation.cjs
          node scripts/test_witness_moderation.cjs
          node scripts/test_research_hub.cjs
      - name: Account deletion is guarded and read-only (mock identities)
        run: |
          node --check supabase/functions/dd-account-deletion/preflight-core.mjs
          node --check scripts/test_account_deletion_preflight_20261108.cjs
          node scripts/test_account_deletion_preflight_20261108.cjs
          node --check supabase/functions/dd-account-deletion/execution-core.mjs
          node --input-type=module --check < supabase/functions/dd-account-deletion/execute-staging-only.ts
          node --check scripts/test_account_deletion_execution_20261108.cjs
          node scripts/test_account_deletion_execution_20261108.cjs
          node --check supabase/functions/dd-account-deletion/operator-recovery-core.mjs
          node --check scripts/test_account_deletion_recovery_20261108.cjs
          node scripts/test_account_deletion_recovery_20261108.cjs
          node --check supabase/functions/dd-account-deletion/write-fence-spec-core.mjs
          node --check scripts/test_account_deletion_write_fence_20261108.cjs
          node scripts/test_account_deletion_write_fence_20261108.cjs
          node --check scripts/test_account_deletion_live_audit_contract_20261108.cjs
          node scripts/test_account_deletion_live_audit_contract_20261108.cjs
      - name: Verify restricted static bundle and every published link (NO deploy)
        run: |
          node scripts/test_public_release_package.cjs
          node scripts/audit_public_pages_20261108.cjs
  real-browser:
    name: Offline real Chromium editor acceptance gate (NO deploy)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned Chromium QA package
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1 leaflet@1.9.4
          test -x /usr/bin/google-chrome
          node --check scripts/test_research_editor_real_chromium_20261108.cjs
          node --check scripts/test_m32_actual_writer_ribbon_chromium_20261109.cjs
          node --check scripts/test_m34_writer_image_recovery_chromium_20261109.cjs
      - name: Start strictly local-only test origin
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dd-research-chrome.log 2>&1 &
          echo $! >/tmp/dd-research-chrome.pid
          for i in $(seq 1 20); do
            curl -fsS --max-time 2 http://127.0.0.1:4173/research/research-text-size.js >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/dd-research-chrome.log
          exit 1
      - name: Run actual Chromium mobile editor tests without cloud access
        run: |
          node scripts/test_research_editor_real_chromium_20261108.cjs
          node scripts/test_m32_actual_writer_ribbon_chromium_20261109.cjs
          node scripts/test_m34_writer_image_recovery_chromium_20261109.cjs
          node scripts/test_research_review_chromium_20261108.cjs
          node scripts/test_research_library_chromium_20261108.cjs
          node scripts/test_research_nav_avatar_chromium_20261108.cjs
          node scripts/test_analytics_consent_chromium_20261108.cjs
          node scripts/audit_public_pages_chromium_20261108.cjs
          node scripts/test_browser_release_smoke.cjs
          node scripts/test_comment_action_rail_chromium_20261108.cjs
          node scripts/audit_full_site_chromium_20261108.cjs
          node scripts/test_m28_public_workflows_chromium_20261108.cjs
          node scripts/test_research_home_navigation_chromium_20261108.cjs
          node scripts/test_research_json_restore_chromium_20261108.cjs
          node scripts/test_m30_first_document_chromium_20261109.cjs
      - name: Stop loopback-only test origin
        if: always()
        run: kill "$(cat /tmp/dd-research-chrome.pid)" || true

  isolated-postgres-write-fence:
    # Disposable local-only Postgres; never reaches the real Supabase project.
    if: github.ref == 'refs/heads/fix/compact-writing-popover-mobile-desktop-nov08'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dd_fence_fixture
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dd_fence_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: dd_fence_fixture
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local PostgreSQL client only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version
      - name: Compile owner-fence SQL against disposable PostgreSQL 17 schema
        run: |
          node --check scripts/generate_account_deletion_pg_fixture_20261108.cjs
          node --check scripts/test_account_deletion_postgres_20261108.cjs
          node scripts/generate_account_deletion_pg_fixture_20261108.cjs >/tmp/dd-disposable-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/dd-disposable-fixture.sql >/tmp/dd-fixture-setup.log
          psql -X -v ON_ERROR_STOP=1 -f supabase/ACCOUNT_DELETION_WRITE_FENCE_DRAFT_NOT_APPLIED.sql >/tmp/dd-fence-compile.log
          node scripts/test_account_deletion_postgres_20261108.cjs
      - name: M34 isolated news article vote RPC and RLS acceptance (NO LIVE DB)
        run: |
          node --check scripts/test_m34_news_votes_pg_20261109.cjs
          node scripts/test_m34_news_votes_pg_20261109.cjs
