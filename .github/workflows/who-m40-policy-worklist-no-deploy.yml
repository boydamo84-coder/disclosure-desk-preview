name: "Who source reviews and directory QA NO DEPLOY"
on:
  push:
    branches:
      - prep/who-m40-policy-evidence-worklist-20261117
      - prep/who-m41-complete-directory-source-pass-20261117
      - prep/who-m42-original-broadcast-links-20261117
      - prep/who-m43-council-bluffs-sample-records-20261117
      - prep/who-m44-aawsap-transfer-records-20261117
      - prep/who-m45-im1-spherule-evidence-20261117
      - prep/who-m46-grusch-whistleblower-record-20261117
      - prep/who-m47-navy-aircrew-records-20261117
      - prep/who-m48-omaha-and-nimitz-analysis-20261117
      - prep/who-m49-rendlesham-records-20261117
      - prep/who-m50-complete-evidence-summary-links-20261117
      - prep/who-m51-source-access-provenance-20261117
      - prep/who-m52-source-lineage-reader-20261117
      - prep/who-m53-source-return-case-lineage-20261117
      - prep/who-m54-archive-context-back-20261117
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the four public reader files, original source and withheld ratings
        run: |
          node --check assets/people-directory.js
          node --check assets/who-archive-return.js
          node --check scripts/test_who_claim_evidence_contract.cjs
          node --check scripts/test_who_source_lineage.cjs
          node --check scripts/test_who_m26_hearing_spotchecks.cjs
          node --check scripts/test_who_m27_readonly_launch_gate.cjs
          node --check scripts/test_who_m28_hearing_crosschecks.cjs
          node --check scripts/test_who_m28b_original_sources.cjs
          node --check scripts/test_who_m28c_firstparty_lineage.cjs
          node --check scripts/test_who_m28d_broadcast_provenance.cjs
          node --check scripts/test_who_m28e_final_seven_sources.cjs
          node --check scripts/test_who_m29_editorial_handoff.cjs
          node --check scripts/test_who_m30_editorial_adversarial.cjs
          node --check scripts/test_who_m31_house_source_comparison.cjs
          node --check scripts/test_who_m32_source_separation.cjs
          node --check scripts/test_who_m33_navy_historical_provenance.cjs
          node --check scripts/test_who_m34_primary_provenance.cjs
          node --check scripts/test_who_m35_source_versioning.cjs
          node --check scripts/test_who_m36_nara_navair_foia_contract.cjs
          node --check scripts/test_who_m37_referral_archives_contract.cjs
          node --check scripts/test_who_m38_cross_case_guard.cjs
          node --check scripts/test_who_m39_source_tracker_contract.cjs
          node --check scripts/test_who_m40_policy_worklist.cjs
          node --check scripts/test_who_m50_summary_links.cjs
          node --check scripts/test_who_m51_source_provenance.cjs
          node --check scripts/test_who_m52_source_lineage.cjs
          node --check scripts/test_person_case_links.cjs
          node --check scripts/test_who_m53_case_lineage_contract.cjs
          node --check scripts/test_who_m54_archive_return_contract.cjs
          node --check assets/source-verification.js
          node --check assets/people-directory.js
          node scripts/test_who_claim_evidence_contract.cjs
          node scripts/test_who_source_lineage.cjs
          node scripts/test_who_m26_hearing_spotchecks.cjs
          node scripts/test_who_m27_readonly_launch_gate.cjs
          node scripts/test_who_m28_hearing_crosschecks.cjs
          node scripts/test_who_m28b_original_sources.cjs
          node scripts/test_who_m28c_firstparty_lineage.cjs
          node scripts/test_who_m28d_broadcast_provenance.cjs
          node scripts/test_who_m28e_final_seven_sources.cjs
          node scripts/test_who_m29_editorial_handoff.cjs
          node scripts/test_who_m30_editorial_adversarial.cjs
          node scripts/test_who_m31_house_source_comparison.cjs
          node scripts/test_who_m32_source_separation.cjs
          node scripts/test_who_m33_navy_historical_provenance.cjs
          node scripts/test_who_m34_primary_provenance.cjs
          node scripts/test_who_m35_source_versioning.cjs
          node scripts/test_who_m36_nara_navair_foia_contract.cjs
          node scripts/test_who_m37_referral_archives_contract.cjs
          node scripts/test_who_m38_cross_case_guard.cjs
          node scripts/test_who_m39_source_tracker_contract.cjs
          node scripts/test_who_m40_policy_worklist.cjs
          node scripts/test_who_m50_summary_links.cjs
          node scripts/test_who_m51_source_provenance.cjs
          node scripts/test_who_m52_source_lineage.cjs
          node scripts/test_person_case_links.cjs
          node scripts/test_who_m53_case_lineage_contract.cjs
          node scripts/test_who_m54_archive_return_contract.cjs
      - name: Assert private rating SQL and synthetic accounts not copied to release candidate
        run: |
          test ! -f docs/WHO_CLAIM_RATINGS_SQL_DRAFT_ONLY_2026-11-15.sql
          test ! -f scripts/test_who_rating_gotrue_e2e.cjs
          test ! -f scripts/who_rating_signed_jwt_http_seed.sql
      - name: Build public allowlist locally and verify manifest SHA-256 hashes
        run: |
          node scripts/build_public_release.cjs
          node scripts/test_who_public_package_boundary.cjs
          test ! -f .release-staging/public-site/data/who-m31-house-source-comparison.json
          test ! -f .release-staging/public-site/docs/WHO_M31_PRIMARY_HEARING_COMPARISON_2026-11-16.md
          test ! -f .release-staging/public-site/data/who-m32-immaculate-source-lineage.json
          test ! -f .release-staging/public-site/docs/WHO_M32_IMMACULATE_SOURCE_LINEAGE_2026-11-16.md
          test ! -f .release-staging/public-site/data/who-m33-navy-historical-source-audit.json
          test ! -f .release-staging/public-site/docs/WHO_M33_NAVY_ORIGINAL_AND_TIMELINE_AUDIT_2026-11-16.md
          test ! -f .release-staging/public-site/data/who-m34-nimitz-mj12-primary-sources.json
          test ! -f .release-staging/public-site/docs/WHO_M34_NIMITZ_MJ12_PRIMARY_RECORDS_2026-11-16.md
          test ! -f .release-staging/public-site/data/who-m35-source-version-review.json
          test ! -f .release-staging/public-site/docs/WHO_M35_NARA_REVISION_AND_MEDIA_LINEAGE_2026-11-16.md
          test ! -f .release-staging/public-site/data/who-m36-nara-navair-foia-evidence.json
          test ! -f .release-staging/public-site/docs/WHO_M36_NARA_NAVAIR_PRIMARY_SOURCE_AUDIT_2026-11-16.md
          test ! -f .release-staging/public-site/data/who-m37-osd-referral-provenance.json
          test ! -f .release-staging/public-site/docs/WHO_M37_OSD_REFERRAL_AND_NARA_FINDING_AID_2026-11-16.md
          test ! -f .release-staging/public-site/data/who-m38-osd-151-cross-case-audit.json
          test ! -f .release-staging/public-site/docs/WHO_M38_151_PAGE_FOIA_CROSS_CASE_2026-11-16.md
          test -f .release-staging/public-site/data/public-source-verification.json
          test -f .release-staging/public-site/assets/source-verification.js
          test ! -f .release-staging/public-site/data/who-m40-policy-source-worklist.json
          test ! -f .release-staging/public-site/docs/WHO_M40_POLICY_RECORDS_SOURCE_TRIAGE_2026-11-17.md
          test ! -f .release-staging/public-site/docs/WHO_M51_SOURCE_PROVENANCE_AUDIT_2026-11-17.md
          test ! -f .release-staging/public-site/docs/WHO_M52_SOURCE_LINEAGE_READER_2026-11-17.md
          test ! -f .release-staging/public-site/docs/WHO_M53_SOURCE_RETURN_CASE_LINEAGE_2026-11-17.md
          test ! -f .release-staging/public-site/docs/WHO_M54_ARCHIVE_CONTEXT_RETURN_2026-11-17.md
          echo 'M51 source provenance staged; private research documentation excluded from strict public allowlist'
          echo "No deploy, Netlify or Supabase credentials used"

  chromium-phone-tablet-desktop:
    needs: source-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser test driver
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          test -x /usr/bin/google-chrome
          node --check scripts/test_who_claim_evidence_chromium.cjs
          node --check scripts/test_who_m28_hearing_crosschecks_chromium.cjs
          node --check scripts/test_who_m28b_original_sources_chromium.cjs
          node --check scripts/test_who_m28c_firstparty_lineage_chromium.cjs
          node --check scripts/test_who_m28d_broadcast_provenance_chromium.cjs
          node --check scripts/test_who_m28e_final_seven_sources_chromium.cjs
          node --check scripts/test_who_m29_editorial_handoff_chromium.cjs
          node --check scripts/test_who_m39_source_tracker_chromium.cjs
          node --check scripts/test_who_m40_policy_chromium.cjs
          node --check scripts/test_who_m51_source_provenance_chromium.cjs
          node --check scripts/test_who_m52_source_lineage_chromium.cjs
          node --check scripts/test_who_m53_source_return_chromium.cjs
          node --check scripts/test_who_m54_archive_return_chromium.cjs
      - name: Run real Chrome on Who policy source guide and inherited M39 tracker safeguards
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/who-m29-readonly-http.log 2>&1 &
          echo $! > /tmp/who-m29-readonly-http.pid
          for i in $(seq 1 20); do
            curl -fsS --max-time 2 http://127.0.0.1:4173/who-is-who.html >/dev/null && break
            sleep 1
          done
          node scripts/test_who_claim_evidence_chromium.cjs
          node scripts/test_who_m28_hearing_crosschecks_chromium.cjs
          node scripts/test_who_m28b_original_sources_chromium.cjs
          node scripts/test_who_m28c_firstparty_lineage_chromium.cjs
          node scripts/test_who_m28d_broadcast_provenance_chromium.cjs
          node scripts/test_who_m28e_final_seven_sources_chromium.cjs
          node scripts/test_who_m29_editorial_handoff_chromium.cjs
          node scripts/test_who_m39_source_tracker_chromium.cjs
          node scripts/test_who_m40_policy_chromium.cjs
          node scripts/test_who_m51_source_provenance_chromium.cjs
          node scripts/test_who_m52_source_lineage_chromium.cjs
          node scripts/test_who_m53_source_return_chromium.cjs
          node scripts/test_who_m54_archive_return_chromium.cjs
      - name: Stop local-only web server
        if: always()
        run: |
          if test -f /tmp/who-m29-readonly-http.pid; then
            kill "$(cat /tmp/who-m29-readonly-http.pid)" 2>/dev/null || true
          fi
