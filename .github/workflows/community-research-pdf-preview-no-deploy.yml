name: Community Research genuine PDF preview QA (no deploy)
on:
  push:
    branches: [feature/community-research-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PDF parser and browser library for loopback QA only
        run: npm install --no-save --no-package-lock --ignore-scripts pdfjs-dist@6.5.438 playwright-core@1.56.1
      - name: Verify real PDF rendering and local review boundaries
        run: |
          node --check docs/community-research/pdf-upload-preview.mjs
          node --check assets/community-research.js
          node scripts/test_community_research_pdf_preview.cjs
