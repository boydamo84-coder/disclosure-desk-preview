name: Canada LAC individual catalogue reference probe (DEV only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/mobile-video-performance-oct31
          persist-credentials: false
      - name: Find official item-level catalogue entry links
        run: |
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          from pathlib import Path
          from html.parser import HTMLParser
          class A(HTMLParser):
            def __init__(self):super().__init__();self.href=None;self.buf=[];self.links=[]
            def handle_starttag(self,tag,attrs):
              if tag=='a':self.href=dict(attrs).get('href');self.buf=[]
            def handle_data(self,t):
              if self.href is not None:self.buf.append(t)
            def handle_endtag(self,tag):
              if tag=='a' and self.href is not None:self.links.append((' '.join(self.buf).strip(),self.href));self.href=None
          urls=['https://www.canada.ca/en/library-archives/collection/research-help/science-technology/ufos.html',
                'https://www.canada.ca/en/library-archives/collection/basics/using-collection-search.html']
          links={}
          for url in urls:
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Disclosure Desk official archive research)'})
              with urllib.request.urlopen(request,timeout=24) as response:body=response.read(1_500_001);status=response.status
              if len(body)>1_500_000:raise RuntimeError('Oversized official page')
              parser=A();parser.feed(body.decode('utf-8','replace'))
              print('Official page:',url,'HTTP:',status,'links:',len(parser.links))
              for label,href in parser.links:
                full=urllib.parse.urljoin(url,href)
                hostname=urllib.parse.urlsplit(full).hostname or ''
                if not (hostname.endswith('canada.ca') or hostname.endswith('bac-lac.gc.ca') or hostname.endswith('collectionscanada.gc.ca')):continue
                if re.search(r'ufo|ovni|collection.*search|item|record|search|recherche|catalogue|database|archive',label+' '+full,re.I):
                  links[full]=label[:110]
            except Exception as exc:print('Source access warning:',type(exc).__name__,str(exc)[:150])
          print('Distinct official catalogue/search candidates:',len(links))
          for url,title in list(links.items())[:80]:print(repr(title),url)
          archive=json.loads(Path('data/historical-news-archive.json').read_text(encoding='utf-8'))
          canada=[r for r in archive if str(r.get('country','')).casefold()=='canada']
          print('Existing Canadian records:',len(canada))
          print('Existing IDs:',[r.get('id') for r in canada[:20]])
          item_urls=[u for u in links if re.search(r'(item|record|id=|opac|recherche-collection|search-collection)',u,re.I)]
          print('Possible item-level / catalogue endpoints:',len(item_urls))
          print('NO cases imported; documents are not equivalent to unique sightings.')
          print('NO deployment.')
          PY
