name: Chile SEFAA case index import preview (DEV only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/mobile-video-performance-oct31
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preview official SEFAA PDF case references (no changes)
        run: |
          python - <<'PY'
          import json,re,urllib.request,collections
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlsplit,unquote,quote,urlunsplit
          from pathlib import Path
          class Links(HTMLParser):
            def __init__(self):super().__init__();self.href=None;self.parts=[];self.links=[]
            def handle_starttag(self,tag,attrs):
              if tag=='a':self.href=dict(attrs).get('href');self.parts=[]
            def handle_data(self,txt):
              if self.href is not None:self.parts.append(txt)
            def handle_endtag(self,tag):
              if tag=='a' and self.href is not None:
                self.links.append((' '.join(self.parts).strip(),self.href));self.href=None
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'DisclosureDeskArchiveAudit/1.0'})
            with urllib.request.urlopen(req,timeout=20) as res:body=res.read(1_500_001)
            if len(body)>1_500_000:raise ValueError('Oversized source page')
            p=Links();p.feed(body.decode('utf-8','replace'));return p.links
          archive=json.loads(Path('data/historical-news-archive.json').read_text())
          present={r['id'] for r in archive}
          pages={}
          for year in range(2018,2027):
            try:
              base=f'https://sefaa.dgac.gob.cl/{year}/'
              for label,href in get(base):
                if not re.search(r'casos?\s+(?:resueltos?\s+)?(?:enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)',label,re.I):continue
                u=urljoin(base,href)
                if urlsplit(u).hostname=='sefaa.dgac.gob.cl':pages[u]=year
            except Exception as exc: print('Annual source skipped:',year,type(exc).__name__)
          cases=collections.defaultdict(set);unknown=0;failed=0
          for page in pages:
            try:
              for label,href in get(page):
                u=urljoin(page,href);parts=urlsplit(u)
                if parts.hostname!='sefaa.dgac.gob.cl' or not unquote(parts.path).lower().endswith('.pdf'):continue
                filename=unquote(parts.path).split('/')[-1]
                m=re.search(r'caso[\s_-]*(?:n[°ºo.]*)?[\s_-]*(\d{2,5})(?!\d)',filename,re.I)
                if not m:unknown+=1;continue
                u=urlunsplit((parts.scheme,parts.netloc,quote(unquote(parts.path),safe='/'),parts.query,''))
                cases[m.group(1)].add(u)
            except Exception as exc:
              failed+=1;print('Monthly page failed:',type(exc).__name__)
          if failed:raise RuntimeError('Incomplete monthly audit; import preview must not report success')
          missing=[n for n in cases if 'sefaa-'+n not in present]
          print('Official monthly pages:',len(pages))
          print('Unique candidate case numbers:',len(cases))
          print('Candidate case references absent by ID:',len(missing))
          print('Duplicate case numbers with multiple PDFs:',sum(len(v)>1 for v in cases.values()))
          print('Unidentified PDF links:',unknown)
          print('Sample missing identifiers:',sorted(missing)[:20])
          if len(cases)<100:raise RuntimeError('Unexpectedly low count')
          print('Preview only: No PDFs stored, no archive changed, no Netlify deployment.')
          PY
