name: "Who M64 integrated member criteria NO DEPLOY"
on:
  push:
    branches:
      - prep/who-m64-claim-ballot-integration-20261118
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-policy-and-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify the integrated feature fails closed
        run: |
          node --check assets/who-evidence-ballot-m64.js
          node --check scripts/test_who_m64_integration_chromium.cjs
          node scripts/test_who_m64_integration_contract.cjs
          node scripts/test_who_m63_ballot_contract.cjs
          node scripts/test_who_m62_source_first_contract.cjs
          node scripts/test_who_m60_six_profiles.cjs
          node scripts/test_who_m57_community_criteria_contract.cjs
      - name: Build immutable offline candidate, never deploy
        run: |
          node scripts/build_public_release.cjs
          node scripts/test_who_public_package_boundary.cjs
          test -f .release-staging/public-site/assets/who-evidence-ballot-m64.js
          test -f .release-staging/public-site/data/who-community-approvals-m64.json
          node -e "let x=require('./.release-staging/public-site/data/who-community-approvals-m64.json');if(x.approvedClaims.length)process.exit(1)"
          grep -q 'whoEvidenceBallots:false' .release-staging/public-site/assets/community-test-config.js
          test ! -e .release-staging/public-site/docs/WHO_M63_FIVE_CRITERIA_BALLOTS_SQL_DRAFT_ONLY.sql
          test ! -e .release-staging/public-site/scripts/fixtures/who-m63-member-ballot.html
  chromium-who-integrated-phones-and-desktop:
    needs: source-policy-and-public-release
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fixed tested browser driver
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          test -x /usr/bin/google-chrome
      - name: Real Who's Who navigation, source-first, synthetic account tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/dd-who-m64-http.log 2>&1 &
          echo $! > /tmp/dd-who-m64-http.pid
          for i in $(seq 1 20); do
            curl -fsS --max-time 2 http://127.0.0.1:4173/who-is-who.html >/dev/null && break
            sleep 1
          done
          node scripts/test_who_m62_source_first_chromium.cjs
          node scripts/test_who_m64_integration_chromium.cjs
      - name: Shut down isolated preview
        if: always()
        run: |
          if test -f /tmp/dd-who-m64-http.pid; then kill "$(cat /tmp/dd-who-m64-http.pid)" 2>/dev/null || true; fi
  disposable-postgres-privacy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: m64qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d m64qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: m64qa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure disposable PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Replay M63 exact server-side privacy and cap tests without external DB
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/who-m63-rls-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f docs/WHO_M63_FIVE_CRITERIA_BALLOTS_SQL_DRAFT_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/who-m63-rls-test.sql
          echo "Disposable test database only; NO Supabase changes"
