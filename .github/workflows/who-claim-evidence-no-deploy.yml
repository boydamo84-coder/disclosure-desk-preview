name: Who's Who claim-evidence editorial gate (NO DEPLOY)
on:
  push:
    branches:
      - feature/who-evidence-score-framework-20261115
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-package:
    runs-on: ubuntu-latest
    env:
      CONTEXT: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax and mock-reviewed editorial checks
        run: |
          node --check assets/people-directory.js
          node --check scripts/test_who_claim_evidence_contract.cjs
          node scripts/test_who_claim_evidence_contract.cjs
          node --check scripts/test_who_source_lineage.cjs
          node scripts/test_who_source_lineage.cjs
          node --check scripts/test_who_rating_backend_draft_static.cjs
          node scripts/test_who_rating_backend_draft_static.cjs
      - name: Build PUBLIC allowlisted website locally without publishing
        run: |
          node scripts/build_public_release.cjs
          test -f .release-staging/public-site/who-is-who.html
          test -f .release-staging/public-site/assets/people-directory.js
          test -f .release-staging/public-site/data/public-people-directory.json
          node --check scripts/test_who_public_package_boundary.cjs
          node scripts/test_who_public_package_boundary.cjs
          node -e "const fs=require('fs');const h=fs.readFileSync('.release-staging/public-site/who-is-who.html','utf8');if(!h.includes('profileEvidenceReviews'))process.exit(1);"
          echo "Strict static package contains Who's Who review. No Netlify deployment."
  offline-chromium:
    name: Who evidence panels across phone/tablet/desktop (NO deploy)
    needs: source-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated pinned Chromium driver (no deploy)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          test -x /usr/bin/google-chrome
          node --check scripts/test_who_claim_evidence_chromium.cjs
      - name: Start strictly loopback-only source web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/who-evidence-local.log 2>&1 &
          echo $! > /tmp/who-evidence-local.pid
          for i in $(seq 1 20); do
            curl -fsS --max-time 2 http://127.0.0.1:4173/who-is-who.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/who-evidence-local.log
          exit 1
      - name: Test 23 draft claims and FOIA-only reader with no external account
        run: node scripts/test_who_claim_evidence_chromium.cjs
      - name: Stop loopback server
        if: always()
        run: |
          if test -f /tmp/who-evidence-local.pid; then
            kill "$(cat /tmp/who-evidence-local.pid)" || true
          fi
