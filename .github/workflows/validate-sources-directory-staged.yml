name: Sources & Archives staging QA (no deploy)
on:
  push:
    branches:
      - feature/sources-archives-next-batch-nov03
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Static archive directory checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source directory, 11-tab layout and indexing
        run: |
          node --check scripts/test_sources_directory.cjs
          node scripts/test_sources_directory.cjs
      - name: Validate eight-hour breaking and 48-hour TV news ticker (synthetic, no network)
        run: |
          node --check assets/news-ticker.js
          node --check scripts/test_news_ticker.cjs
          node scripts/test_news_ticker.cjs
      - name: Verify staged private profile photo owner isolation and Storage review contract
        run: |
          node --check assets/profile-avatars.js
          node --check scripts/test_profile_avatars.cjs
          node scripts/test_profile_avatars.cjs
      - name: Verify witness submit Edge CORS/JWT client-source and privacy (no HTTP POST)
        run: |
          node --check scripts/test_witness_community.cjs
          node scripts/test_witness_community.cjs
      - name: Validate review-only database privilege inventory (no SQL execution)
        run: |
          node --check scripts/test_community_privilege_review.cjs
          node scripts/test_community_privilege_review.cjs
      - name: Simulate owner account changes and personal actions without network
        run: |
          node --check scripts/test_research_hub_owner_runtime.cjs
          node scripts/test_research_hub_owner_runtime.cjs
      - name: Test synthetic username owner switch and duplicate-error UX (no backend)
        run: |
          node --check scripts/test_public_profiles_owner_runtime.cjs
          node scripts/test_public_profiles_owner_runtime.cjs
      - name: Exercise LIVE hearing chat opening and expiry on synthetic clock (no network)
        run: |
          node --check assets/live-schedule.js
          node --check scripts/test_live_schedule.cjs
          node scripts/test_live_schedule.cjs
          node --check scripts/test_live_chat_archive.cjs
          node scripts/test_live_chat_archive.cjs
          node --check scripts/test_live_chat_window_runtime.cjs
          node scripts/test_live_chat_window_runtime.cjs
      - name: Test public case comments against stale responses and cross-case posts (mock only)
        run: |
          node --check assets/case-discussions.js
          node --check scripts/test_case_discussions_runtime.cjs
          node scripts/test_case_discussions_runtime.cjs
      - name: Test read-only archived LIVE chat lifecycle and pagination (fake approved messages)
        run: |
          node --check assets/live-chat.js
          node --check scripts/test_live_chat_archive_runtime.cjs
          node scripts/test_live_chat_archive_runtime.cjs
      - name: Exercise mobile tour, keyboard focus and 11-tab navigation (synthetic only)
        run: |
          node --check scripts/test_mobile_tour_a11y.cjs
          node scripts/test_mobile_tour_a11y.cjs
          node --check scripts/test_guided_tour_2026.cjs
          node scripts/test_guided_tour_2026.cjs
      - name: Validate My Research Hub navigation and collapsible panels
        run: |
          node --check scripts/test_research_hub.cjs
          node scripts/test_research_hub.cjs
          node --check assets/research-hub.js
      - name: Verify private backup email template and email security contract
        run: |
          node --check supabase/functions/email-board-backup/email-template.mjs
          node --check scripts/test_backup_email_template.mjs
          node scripts/test_backup_email_template.mjs
      - name: Validate live versus planned community rules
        run: |
          node --check scripts/test_community_rules_accuracy.cjs
          node scripts/test_community_rules_accuracy.cjs
      - name: Static review of private 1-to-1 consent backend (no SQL deploy)
        run: |
          node --check scripts/test_private_chat_sql.cjs
          node scripts/test_private_chat_sql.cjs
      - name: Validate disabled in-Profile Chat UI and backend contract
        run: |
          node --check assets/profile-private-chat.js
          node --check scripts/test_private_chat_ui.cjs
          node scripts/test_private_chat_ui.cjs
          node --check scripts/test_private_chat_account_switch_runtime.cjs
          node scripts/test_private_chat_account_switch_runtime.cjs
          node --check scripts/test_private_chat_switch_mutations.cjs
          node scripts/test_private_chat_switch_mutations.cjs
      - name: Validate disabled Discussions UI and community stewardship boundaries
        run: |
          node --check assets/community-discussions.js
          node --check scripts/test_discussions_ui.cjs
          node scripts/test_discussions_ui.cjs
          node --check scripts/test_discussions_account_switch_runtime.cjs
          node scripts/test_discussions_account_switch_runtime.cjs
      - name: Verify gated Discussions in W.NE dock and safe deep-link (synthetic only)
        run: |
          node --check scripts/test_wne_discussions_nav.cjs
          node scripts/test_wne_discussions_nav.cjs
      - name: Validate review-only Discussions backend permissions (no SQL deploy)
        run: |
          node --check scripts/test_discussions_sql.cjs
          node scripts/test_discussions_sql.cjs
      - name: Validate staged overall-owner forum moderation (no backend deployment)
        run: |
          node --check assets/discussions-admin.js
          node --check scripts/test_discussions_admin.cjs
          node scripts/test_discussions_admin.cjs
      - name: Validate dormant voluntary support link and verified Ko-fi destination
        run: |
          node --check assets/support-site.js
          node --check scripts/test_support_site.cjs
          node scripts/test_support_site.cjs
      - name: Check source-grounded historical weather satellite case links
        run: |
          node --check assets/historical-satellite.js
          node --check scripts/test_historical_satellite.cjs
          node scripts/test_historical_satellite.cjs
      - name: Verify standalone BDS Finance synthetic-only prototype (no deployment)
        run: |
          node --check scripts/test_bds_finance_demo.cjs
          node scripts/test_bds_finance_demo.cjs
      - name: Validate BDS Finance phone-only architecture limitations (no deploy)
        run: |
          node --check scripts/test_bds_finance_local_first_docs.cjs
          node scripts/test_bds_finance_local_first_docs.cjs
