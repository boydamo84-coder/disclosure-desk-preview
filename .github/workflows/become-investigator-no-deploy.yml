name: Become the Investigator QA (no deploy)
on:
  push:
    branches: [feature/become-investigator-20261127]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CONTEXT: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict public staging and source checks (no deployment)
        run: |
          node scripts/test_public_release_package.cjs
          node scripts/test_published_html_syntax.cjs
          node scripts/test_guided_tour_2026.cjs
          node scripts/test_search_indexing.cjs
          node scripts/test_m70_release_guard.cjs --bundle
          node scripts/test_become_investigator.cjs
      - name: Real Chromium on four viewport widths
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1 leaflet@1.9.4
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .release-staging/public-site >/tmp/dd-experience-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/index.html -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/test_become_investigator_chromium.cjs
          node scripts/test_experience_discovery_chromium.cjs
          node scripts/test_home_navigation_chromium.cjs
          node scripts/test_m98_app_tour_chromium.cjs
