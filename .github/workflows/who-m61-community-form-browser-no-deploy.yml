name: "Who M61 community worksheet browser QA NO DEPLOY"
on:
  push:
    branches:
      - prep/who-m61-community-form-browser-qa-20261117
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-worksheet-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify five-criterion model and safe public package boundary
        run: |
          node --check scripts/test_who_m61_criteria_browser_chromium.cjs
          node scripts/test_who_m57_community_criteria_contract.cjs
          node scripts/test_who_m60_six_profiles.cjs
          node scripts/build_public_release.cjs
          node scripts/test_who_public_package_boundary.cjs
          test ! -e .release-staging/public-site/scripts/fixtures/who-community-five-criteria-m57.html
          test ! -e .release-staging/public-site/assets/who-community-worksheet-m57.js
  isolated-chrome-phone-to-desktop:
    needs: offline-worksheet-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install fixed browser driver, without app dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          test -x /usr/bin/google-chrome
          node --check scripts/test_who_m61_criteria_browser_chromium.cjs
      - name: Exercise private worksheet through real local Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/who-m61-local-http.log 2>&1 &
          echo $! > /tmp/who-m61-local-http.pid
          for i in $(seq 1 20); do
            curl -fsS --max-time 2 http://127.0.0.1:4173/scripts/fixtures/who-community-five-criteria-m57.html >/dev/null && break
            sleep 1
          done
          node scripts/test_who_m61_criteria_browser_chromium.cjs
      - name: Close local server
        if: always()
        run: |
          if test -f /tmp/who-m61-local-http.pid; then
            kill "$(cat /tmp/who-m61-local-http.pid)" 2>/dev/null || true
          fi
