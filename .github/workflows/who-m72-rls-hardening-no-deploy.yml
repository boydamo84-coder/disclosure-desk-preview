name: Who M72 irreversible withdrawal and private RLS tests — NO DEPLOY
on:
  push:
    branches: [prep/who-m72-disposable-rls-hardening-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-strict-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate private claim voting remains closed
        run: |
          node --check assets/who-evidence-ballot-m64.js
          node --check assets/people-directory.js
          node scripts/test_who_m64_integration_contract.cjs
          node scripts/test_who_m72_hardening_contract.cjs
          node scripts/test_site_ads_m02_contract.cjs
          node scripts/test_ga4_retirement_20261118.cjs
      - name: Package production-shaped website offline
        env:
          CONTEXT: production
        run: |
          node scripts/build_public_release.cjs
          node scripts/test_public_release_package.cjs
          test -f .release-staging/public-site/assets/who-evidence-ballot-m64.js
          test -f .release-staging/public-site/assets/who-evidence-ballot-m64.css
          test -f .release-staging/public-site/data/who-community-approvals-m64.json
          grep -q 'whoEvidenceBallots:false' .release-staging/public-site/assets/community-test-config.js
          node -e "const a=require('./.release-staging/public-site/data/who-community-approvals-m64.json');if(a.approvedClaims.length!==0)process.exit(1)"
          test ! -e .release-staging/public-site/docs/WHO_M63_FIVE_CRITERIA_BALLOTS_SQL_DRAFT_ONLY.sql
          test ! -e .release-staging/public-site/scripts/fixtures/who-m63-rls-test.sql
          test ! -e .release-staging/public-site/scripts/test_who_m64_integration_chromium.cjs
  who-frontend-synthetic-chrome:
    needs: source-and-strict-package
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          test -x /usr/bin/google-chrome
      - name: Test real Who page with synthetic users and blocked network
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dd-who-m67.log 2>&1 &
          echo $! >/tmp/dd-who-m67.pid
          for i in $(seq 1 15); do
            curl -fsS --max-time 2 http://127.0.0.1:4173/who-is-who.html >/dev/null && break
            sleep 1
          done
          node scripts/test_who_m64_integration_chromium.cjs
      - name: Stop local fixture
        if: always()
        run: |
          if test -f /tmp/dd-who-m67.pid; then kill "$(cat /tmp/dd-who-m67.pid)" 2>/dev/null || true; fi
  voting-isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dd_who_m67_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dd_who_m67_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: dd_who_m67_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure PostgreSQL client present
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Verify RLS in disposable database only — no Supabase changes
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/who-m63-rls-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f docs/WHO_M63_FIVE_CRITERIA_BALLOTS_SQL_DRAFT_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/who-m63-rls-test.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/who-m72-m63-adversarial-test.sql
      - name: Verify aggregate thresholds and withdrawal in second isolated database
        run: |
          createdb dd_who_m67_publishqa
          export PGDATABASE=dd_who_m67_publishqa
          # Roles are cluster-wide and already exist from the first disposable DB.
          # Recreate only database-local auth schema/functions for this second database.
          sed '/^create role /d' scripts/fixtures/who-m63-rls-bootstrap.sql | psql -v ON_ERROR_STOP=1
          psql -v ON_ERROR_STOP=1 -f docs/WHO_M63_FIVE_CRITERIA_BALLOTS_SQL_DRAFT_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f docs/WHO_M65_AGGREGATE_RELEASE_SQL_DRAFT_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/who-m65-aggregate-release-test.sql
          psql -v ON_ERROR_STOP=1 -f docs/WHO_M66_POSTPUBLICATION_WITHDRAWAL_SQL_DRAFT_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/who-m66-withdrawal-lifecycle-test.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/who-m72-postpub-adversarial-test.sql
