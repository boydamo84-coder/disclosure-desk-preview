name: Import modern official UAP cases
on:
  workflow_dispatch:
concurrency:
  group: disclosure-bluebook-import
  cancel-in-progress: false
jobs:
  modern-cases:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge verified official modern cases
        run: python scripts/import_modern_official_cases.py
      - name: Validate and commit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/historical-news-archive.json').read_text(encoding='utf-8'))
          assert len(rows)==len({r['id'] for r in rows})
          assert all(not any(k in r for k in ('lat','lon','latitude','longitude','street','address')) for r in rows if r['id'].startswith('aaro-'))
          print('Verified archive records:',len(rows))
          PY
          git config user.name "Disclosure Desk Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/historical-news-archive.json
          git diff --cached --quiet || (git commit -m "Import verified modern AARO UAP case references" && git push)
  publish:
    needs: modern-cases
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
