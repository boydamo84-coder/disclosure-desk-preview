name: Refresh DEV news snapshot (no Netlify)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
concurrency:
  group: dev-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/mobile-video-performance-oct31
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google News redirect decoder
        run: python3 -m pip install 'gnews-decoder>=0.1.0,<1.0'
      - name: Validate collector Python syntax
        run: python3 -m py_compile scripts/refresh_dev_news.py
      - name: Collect source-linked news
        run: python3 scripts/refresh_dev_news.py
      - name: Validate non-stale news
        run: |
          python3 - <<'PY'
          import datetime,json
          rows=json.load(open('data/news-alerts.json',encoding='utf-8'))
          newest=max(datetime.datetime.fromisoformat(x['date'].replace('Z','+00:00')) for x in rows)
          days=(datetime.datetime.now(datetime.timezone.utc)-newest).total_seconds()/86400
          print('Most recent feed article:',newest,'age days:',round(days,2))
          assert days<7,'Latest article is stale; investigate RSS pipeline'
          PY
      - name: Commit changed DEV catalogue only
        run: |
          git config user.name "Disclosure Desk News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-alerts.json data/news-feed-health.json
          if git diff --cached --quiet; then
            echo "No fresh changes"
          else
            git commit -m "Refresh DEV news snapshot [skip netlify]"
            git push origin HEAD:dev/mobile-video-performance-oct31
          fi
