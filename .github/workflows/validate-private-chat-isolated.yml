name: Private Chat isolated PostgreSQL 17 security review (no live backend)
on:
  push:
    branches: [feature/sources-archives-next-batch-nov03]
    paths:
      - 'supabase/PRIVATE_CHAT_CONSENT_REVIEW.sql'
      - 'scripts/private-chat-isolated-fixture.sql'
      - 'scripts/private-chat-isolated-acceptance.sql'
      - '.github/workflows/validate-private-chat-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-chat:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-chat-ci-only
          POSTGRES_DB: private_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d private_chat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-chat-ci-only
      PGDATABASE: private_chat_test
    steps:
      - uses: actions/checkout@v4
      - name: Verify disposable PostgreSQL client
        run: psql --version
      - name: Create synthetic fake Auth and username environment
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/private-chat-isolated-fixture.sql
      - name: Install UNAPPLIED chat schema into isolated temporary PostgreSQL only
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/PRIVATE_CHAT_CONSENT_REVIEW.sql
      - name: Exercise real PostgreSQL participant, owner and attacker paths
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/private-chat-isolated-acceptance.sql
