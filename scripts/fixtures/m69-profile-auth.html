<script>window.__boardsVisited=0;window.__fakeAuth={calls:[],user:null,callbacks:[]};
window.DD_COMMUNITY_TEST_CONFIG={environment:'test',url:'https://example.invalid',publishableKey:'synthetic'};
const fake=window.__fakeAuth;
const listQuery=()=>{const q={select(){return q},order(){return q},eq(){return q},limit:async()=>({data:[],count:0,error:null}),maybeSingle:async()=>({data:null,error:null})};return q};
window.supabase={createClient:()=>({
 auth:{
  getUser:async()=>({data:{user:fake.user},error:null}),
  onAuthStateChange(cb){fake.callbacks.push(cb);return {data:{subscription:{unsubscribe(){}}}}},
  signInWithPassword:async({email,password})=>{
   fake.calls.push({action:'signin',email});
   if(password!=='correct-pass-123')return {data:{session:null},error:{message:'Invalid login credentials'}};
   fake.user={id:'synthetic-owner',email,is_anonymous:false,email_confirmed_at:'2026-11-19',user_metadata:{dd_requested_username:'Tester'}};
   for(const fn of fake.callbacks)fn('SIGNED_IN',{user:fake.user});
   return {data:{session:{user:fake.user}},error:null};
  },
  signUp:async({email,password,options})=>{
   fake.calls.push({action:'signup',email,username:options?.data?.dd_requested_username,redirect:options?.emailRedirectTo});
   return {data:{session:null},error:null};
  },
  resetPasswordForEmail:async(email,opts)=>{
   fake.calls.push({action:'reset',email,redirect:opts?.redirectTo});return {data:{},error:null};
  },
  signOut:async()=>{fake.user=null;for(const fn of fake.callbacks)fn('SIGNED_OUT',null);return {error:null}}
 },
 rpc:async(method)=>({data:method==='dd_is_comment_moderator'?false:[],error:null}),
 from:()=>listQuery()
})};
