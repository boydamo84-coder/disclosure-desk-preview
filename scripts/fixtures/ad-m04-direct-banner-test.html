<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disclosure Desk | Local direct-banner synthetic QA only</title><link rel="stylesheet" href="/assets/site-ad-layout-m01.css?v=preview-1"><style>body{font:14px system-ui;background:#0c1722;color:#e9e6da;margin:0;padding:12px}h1{font-size:18px}.nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.nav button{padding:10px}.nav .active{background:#dab77e}.hidden{display:none}#newsGrid,#archiveList{display:grid;grid-template-columns:1fr 1fr;gap:12px}#newsGrid article,#archiveList article{padding:12px;background:#1c3042;min-height:56px;border:1px solid #354558}#discussionsPage{margin-top:12px}.dd-community-banner{border:1px solid #354558;padding:18px}#researchStudio{margin-top:14px}</style></head><body><h1>Local-only test, not a real advertising impression</h1><p>No third-party Adsterra requests on this page; an isolated first-party fake creative is used to test placement and consent.</p><nav class="nav"><button class="tab active" data-tab="discover">News</button><button class="tab" data-tab="archivePage">Archive</button><button class="tab" data-tab="clips">Videos</button><button class="tab" data-tab="discussionsPage">Discussions</button><button class="tab" data-tab="researchStudio">W.NE</button></nav><main><div id="newsGrid" class="news-grid"></div><div id="archiveList" class="hidden"></div><div id="clipsFeed" class="hidden">Video feed, player remains ad-free</div><div id="discussionsPage" class="hidden"><div class="dd-community-banner">Discussion feed</div></div><div id="researchStudio" class="hidden">Private W.NE research — no adverts</div></main><script>for(let i=0;i<19;i++){const a=document.createElement('article');a.dataset.newsId='story-'+i;a.textContent='News story '+(i+1);newsGrid.append(a)}for(let i=0;i<26;i++){const a=document.createElement('article');a.dataset.archiveId='case-'+i;a.textContent='Archive case '+(i+1);archiveList.append(a)}for(const btn of document.querySelectorAll('.nav .tab'))btn.addEventListener('click',()=>{document.querySelectorAll('.nav .tab').forEach(x=>x.classList.toggle('active',x===btn));for(const id of ['newsGrid','archiveList','clipsFeed','discussionsPage','researchStudio'])document.getElementById(id).classList.toggle('hidden',id!==({discover:'newsGrid',archivePage:'archiveList',clips:'clipsFeed',discussionsPage:'discussionsPage',researchStudio:'researchStudio'}[btn.dataset.tab]));window.dispatchEvent(new CustomEvent('dd-public-section-change',{detail:{section:btn.dataset.tab}}))});</script><script defer src="/assets/site-adsterra-m02.js?v=localhost-fake-only"></script></body></html>
